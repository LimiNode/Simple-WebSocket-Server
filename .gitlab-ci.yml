stages:
  - build
  - sanitize

build:
  image: ubuntu:24.04
  parallel:
    matrix:
      - COMPILER: [gcc, clang]
        CXX_STANDARD: [11, 17]
        ASIO_BACKEND: [standalone, boost]
  stage: build
  before_script:
    - apt-get update
    - DEBIAN_FRONTEND=noninteractive apt-get install -y cmake ninja-build libssl-dev libasio-dev libboost-all-dev $COMPILER
  script:
    - export CC=$COMPILER
    - if [ "$COMPILER" = gcc ]; then export CXX=g++; else export CXX=clang++; fi
    - cmake -S . -B build -G Ninja -DCMAKE_CXX_STANDARD=$CXX_STANDARD -DUSE_STANDALONE_ASIO=$([ "$ASIO_BACKEND" = standalone ] && echo ON || echo OFF) -DBUILD_TESTING=ON
    - cmake --build build --parallel
    - ctest --test-dir build --output-on-failure

sanitizers:
  image: ubuntu:24.04
  stage: sanitize
  before_script:
    - apt-get update
    - DEBIAN_FRONTEND=noninteractive apt-get install -y cmake ninja-build clang libssl-dev libasio-dev
  script:
    - export CC=clang CXX=clang++
    - cmake -S . -B build -G Ninja -DCMAKE_CXX_STANDARD=17 -DUSE_STANDALONE_ASIO=ON -DBUILD_TESTING=ON -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
    - cmake --build build --parallel
    - ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 ctest --test-dir build --output-on-failure
